<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>SDARS - Google Maps Style Navigation</title>
<link href="css/main.css" rel="stylesheet"/>
<link href="css/navigation.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Leaflet & Routing -->
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"/>
<link href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" rel="stylesheet"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
<link href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" rel="stylesheet"/>
<style>
        :root {
            --nav-panel-bg: rgba(13, 17, 23, 0.95);
            --nav-sidebar-width: 420px;
            --accent-primary: #00f2ff;
            --accent-danger: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #05070a;
            font-family: 'Inter', sans-serif;
        }

        .navigation-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Sidebar Styling */
        .sidebar {
            width: var(--nav-sidebar-width);
            background: var(--nav-panel-bg);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--accent-primary);
            font-size: 18px;
        }

        .nav-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 14px 14px 14px 45px;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .nav-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 242, 255, 0.2);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* Map Container */
        .map-section {
            flex: 1;
            position: relative;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        /* Tactical Header */
        .tactical-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .tactical-header h2 {
            font-family: var(--font-display, 'Space Grotesk', sans-serif);
            text-transform: uppercase;
            font-size: 1.2rem;
            margin: 0;
            color: #ffffff;
            font-weight: 700;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-nav {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Results Panel */
        .results-panel {
            margin-top: 24px;
            display: none;
        }

        .route-summary {
            background: rgba(0, 242, 255, 0.08);
            border: 1px solid rgba(0, 242, 255, 0.2);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        /* Safety Indicator */
        .safety-indicator {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .safety-indicator.safe {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .safety-indicator.danger {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* Terrain Selector handled by navigation.css */

        /* Map Status Overlay */
        #mapStatus {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 0.85rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
    </style>
<script src="js/lucide.min.js"></script>
</head>
<body>
<div class="navigation-layout">
<div class="sidebar">
<div class="sidebar-header">
<div class="tactical-header">
<h2>Navigation</h2>
<a class="back-btn" href="index.html">Close</a>
</div>
<div class="search-container">
<div class="input-group">
<span class="input-icon">●</span>
<input class="nav-input" id="startInput" onfocus="this.select()" placeholder="Start Point" style="padding-right: 120px;" type="text"/>
<div style="position: absolute; right: 8px; display: flex; gap: 4px;">
<button onclick="enableMapPicker('startInput')" onmouseout="this.style.background='rgba(0, 242, 255, 0.15)'" onmouseover="this.style.background='rgba(0, 242, 255, 0.35)'" style="background: rgba(0, 242, 255, 0.15); border: 1px solid rgba(0, 242, 255, 0.3); cursor: pointer; color: #fff; border-radius: 6px; padding: 5px 8px; font-size: 11px; font-weight: 600; transition: 0.2s;" title="Pick point on map">Map</button>
<button onclick="useMyLocation()" onmouseout="this.style.background='rgba(34, 197, 94, 0.2)'" onmouseover="this.style.background='rgba(34, 197, 94, 0.4)'" style="background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.4); cursor: pointer; color: #fff; border-radius: 6px; padding: 5px 8px; font-size: 11px; font-weight: 600; transition: 0.2s;" title="Use current GPS location">GPS</button>
</div>
</div>
<div class="input-group">
<span class="input-icon" style="color: var(--accent-danger)">▼</span>
<input class="nav-input" id="endInput" onfocus="this.select()" placeholder="Destination" style="padding-right: 70px;" type="text"/>
<div style="position: absolute; right: 8px; display: flex; gap: 4px;">
<button onclick="enableMapPicker('endInput')" onmouseout="this.style.background='rgba(239, 68, 68, 0.2)'" onmouseover="this.style.background='rgba(239, 68, 68, 0.4)'" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); cursor: pointer; color: #fff; border-radius: 6px; padding: 5px 8px; font-size: 11px; font-weight: 600; transition: 0.2s;" title="Pick point on map">Map</button>
</div>
</div>
<button class="btn-nav btn-primary" onclick="calculateSafeRoute()" style="display:flex; align-items:center; justify-content:center; gap:8px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
    Start Navigation
</button>
<div style="margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 10px;">
<label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: #8b949e; font-size: 0.85rem;">
<input id="toggleShelters" onchange="toggleShelters(this.checked)" type="checkbox"/>
<span>Show Relief Hubs (Hospitals/Shelters)</span>
</label>
<label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: #8b949e; font-size: 0.85rem; margin-top: 5px;">
<input id="toggleHazards" onchange="toggleHazards(this.checked)" type="checkbox"/>
<span>Show Active Hazards (Fires/Risks)</span>
</label>
<label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: #8b949e; font-size: 0.85rem; margin-top: 5px;">
<input checked="" id="toggleRoads" onchange="toggleRoadStatuses(this.checked)" type="checkbox"/>
<span>Show Road Closures &amp; Flood Blocks</span>
</label>
</div>
</div>
</div>
<div class="sidebar-content">
<div id="emptyState" style="text-align: center; margin-top: 50px; color: #6b7a99;">
<div style="margin-bottom: 20px; color: #00f2ff;">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
</div>
<h3>AI Danger Probe</h3>
<p style="font-size: 14px; margin-top: 10px;">Enter locations to scan routes for disaster risks and safe passage.</p>
</div>
<div id="routeOptions" style="display: none; margin-bottom: 24px;">
<h3 style="color: white; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px;">Alternate Routes</h3>
<div id="routeOptionsContainer"></div>
</div>
<div class="results-panel" id="routeDetails">
<div class="route-summary">
<div style="display: flex; justify-content: space-between; align-items: center;">
<div>
<div id="travelTime" style="font-size: 24px; font-weight: 800; color: white;">--</div>
<div id="travelDist" style="color: var(--accent-primary); font-size: 14px; font-weight: 600;">-- km</div>
</div>
<div class="safety-indicator" id="safetyIndicator">
    Probing...
</div>
</div>
<div id="detourNotice" style="display: none; margin-top: 14px; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 8px; padding: 12px; font-size: 12px; line-height: 1.5; color: #fca5a5;"></div>
</div>
<h3 style="color: white; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px;">Step-by-Step Security</h3>
<ul id="navigationSteps" style="list-style: none; padding: 0;"></ul>
</div>
</div>
</div>
<div class="map-section" style="position: relative; overflow: hidden;">
<div id="map"></div>
<!-- Tactical Radar / Satellite Sweep Overlay -->
<div class="map-radar-sweep" id="mapRadarSweep"></div>
<div id="mapStatus">
<span style="color: #4caf50">●</span> <span>Datalink Active: SDARS Global Satellite Grid</span>
</div>
<!-- ⭐ Floating Collapsible Tactical Terrain Selector -->
<div class="terrain-selector" id="terrainSelector">
    <button class="terrain-toggle-btn" id="terrainToggleBtn" onclick="toggleTerrainMenu(event)" title="Tactical Map Layers" aria-label="Toggle map layers">
        <svg class="layers-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
            <polyline points="2 17 12 22 22 17"/>
            <polyline points="2 12 12 17 22 12"/>
        </svg>
        <span class="active-layer-indicator"></span>
    </button>
    <div class="terrain-options-menu" id="terrainOptionsMenu">
        <div class="terrain-menu-header">MAP LAYERS</div>
        <button class="terrain-btn active" onclick="selectTerrain('dark', event)" title="Dark Tactical">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            <span class="terrain-label">Dark Tactical</span>
            <span class="terrain-dot"></span>
        </button>
        <button class="terrain-btn" onclick="selectTerrain('satellite', event)" title="Satellite View">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
            <span class="terrain-label">Satellite HD</span>
            <span class="terrain-dot"></span>
        </button>
        <button class="terrain-btn" onclick="selectTerrain('terrain', event)" title="Topographic Terrain">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
            <span class="terrain-label">Topographic</span>
            <span class="terrain-dot"></span>
        </button>
        <button class="terrain-btn" onclick="selectTerrain('streets', event)" title="Standard Streets">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
            <span class="terrain-label">Street Grid</span>
            <span class="terrain-dot"></span>
        </button>
    </div>
</div>
</div>
</div>
<!-- Scripts -->
<script src="js/main.js?v=2.7"></script>
<script src="js/navigation.js?v=2.10"></script>
<script src="js/nav.js"></script><script>document.addEventListener("DOMContentLoaded", function() { if (window.lucide) lucide.createIcons(); });</script>
</body>
</html>
